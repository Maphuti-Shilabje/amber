[project]
name = "amber"
version = "0.1.0"
description = "Personal local-first memory vault, command preservation, and knowledge retrieval hub"
readme = "README.md"
authors = [
    { name = "Maphuti Shilabje" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "fastembed>=0.2.7",
    "trafilatura>=1.8.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
]

[project.scripts]
amber = "backend.cli:main"
amber-server = "backend.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.sources]
"web/static" = "backend/static"
