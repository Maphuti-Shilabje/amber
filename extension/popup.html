<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amber Capture</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #060709;
      color: #f8fafc;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 10px;
      text-transform: uppercase;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .form-group {
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, select, textarea {
      background-color: #0d1117;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #f8fafc;
      padding: 7px 10px;
      font-size: 12px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }
    button {
      background: linear-gradient(180deg, #4f46e5 0%, #4338ca 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
    }
    .link-app {
      font-size: 11px;
      color: #818cf8;
      text-decoration: none;
    }
    .link-app:hover {
      text-decoration: underline;
    }
    .status {
      font-size: 11px;
      margin-top: 8px;
      text-align: center;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>
    <span>amber</span>
    <span class="badge">quick capture</span>
  </h2>
  <form id="popup-form">
    <div class="form-group">
      <label for="pop-type">Type</label>
      <select id="pop-type">
        <option value="bookmark">Bookmark</option>
        <option value="highlight">Highlight / Quote</option>
        <option value="command">Command / Code</option>
        <option value="ai_chat">AI Chat / Recipe</option>
        <option value="note">Note</option>
      </select>
    </div>

    <div class="form-group">
      <label for="pop-title">Title</label>
      <input type="text" id="pop-title" required>
    </div>

    <div class="form-group">
      <label for="pop-payload">Payload</label>
      <textarea id="pop-payload" rows="2" required></textarea>
    </div>

    <div class="form-group">
      <label for="pop-tags">Tags</label>
      <input type="text" id="pop-tags" placeholder="e.g. docs, tool, setup">
    </div>

    <div class="actions">
      <a href="http://127.0.0.1:7474" target="_blank" class="link-app">Open Amber ↗</a>
      <button type="submit" id="btn-save">Preserve</button>
    </div>
    <div id="pop-status" class="status hidden"></div>
  </form>

  <script src="popup.js"></script>
</body>
</html>
